appId: com.texcellent.studio
productName: TeXcellent
copyright: Copyright © 2026 TeXcellent Contributors
electronVersion: 34.3.0
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
extraMetadata:
  name: texcellent
  description: Bilingual LaTeX Studio with TeX Live & MiKTeX autodetection
  author: TeXcellent Contributors
  main: electron/main.cjs
directories:
  output: release
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - package.json
  - "!**/node_modules/**/*"
asar: true
asarUnpack:
  - dist/**/*
  - dist-server/**/*
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  synopsis: Bilingual LaTeX Studio with TeX Live & MiKTeX autodetection
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  identity: null
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
dmg:
  format: UDZO
