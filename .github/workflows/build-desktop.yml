name: Build TeXcellent Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with installer assets'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag name for manual release (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript check
        run: npm run lint

      - name: Run unit tests
        run: npm test

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: test-and-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_pattern: 'release/*.AppImage'
            platform_flag: '--linux'
          - os: windows-latest
            artifact_pattern: 'release/*.exe'
            platform_flag: '--win'
          - os: macos-latest
            artifact_pattern: 'release/*.dmg'
            platform_flag: '--mac'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux AppImage build dependencies (FUSE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend assets
        run: npm run build

      - name: Bundle Express backend for Electron
        run: npm run build:server

      - name: Install Electron & electron-builder
        run: npm install --no-save electron@34.3.0 electron-builder@25.1.8 --legacy-peer-deps

      - name: Package installer (${{ matrix.platform_flag }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npx electron-builder --config electron-builder.yml ${{ matrix.platform_flag }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: texcellent-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.tar.gz
          if-no-files-found: warn

  publish-release:
    name: Create GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true
