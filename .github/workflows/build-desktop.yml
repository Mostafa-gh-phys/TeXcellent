name: Build TeXcellent Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run lint

      - name: Run unit tests
        run: npx tsx --test src/utils/*.test.ts

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: test-and-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_pattern: 'release/*.AppImage'
            platform_flag: '--linux'
          - os: windows-latest
            artifact_pattern: 'release/*.exe'
            platform_flag: '--win'
          - os: macos-latest
            artifact_pattern: 'release/*.dmg'
            platform_flag: '--mac'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Bundle Express backend for Electron
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --outfile=dist-server/server.cjs --packages=external --external:vite

      - name: Install Electron & electron-builder
        run: npm install --no-save electron electron-builder

      - name: Package installer (${{ matrix.platform_flag }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.yml ${{ matrix.platform_flag }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: texcellent-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  publish-release:
    name: Create GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
