name: Build TeXcellent Desktop Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag / version for build & artifact names (e.g. v1.2.0)'
        required: true
        type: string
        default: 'v1.0.0'
      create_release:
        description: 'Publish a GitHub Release with installer assets'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-v3-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-v3-

      - name: Install dependencies
        run: |
          node -e "require('node:fs').rmSync('package-lock.json', { force: true })"
          npm install --legacy-peer-deps --include=optional --no-audit --no-fund
          node scripts/ensure-native-bindings.mjs

      - name: Run TypeScript check
        run: npm run lint

      - name: Run unit tests
        run: npm test

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_path: 'release/*.AppImage'
            platform_flag: '--linux AppImage'
          - os: windows-latest
            artifact_path: 'release/*.exe'
            platform_flag: '--win nsis'
          - os: macos-latest
            artifact_path: 'release/*.dmg'
            platform_flag: '--mac dmg'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for native build tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache npm and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/eb-cache
          key: ${{ runner.os }}-desktop-cache-v4-${{ hashFiles('package.json', 'electron-builder.yml', 'scripts/ensure-native-bindings.mjs', 'scripts/ensure-desktop-icons.mjs') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cache-v4-

      - name: Install Linux AppImage build dependencies (FUSE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2t64 || sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: Enable Windows Developer Mode for winCodeSign symlinks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          Set-ItemProperty -Path $regPath -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Type DWord -Force

      - name: Install project, Electron & pre-built native bindings
        env:
          npm_config_msvs_version: "2022"
        run: |
          node -e "require('node:fs').rmSync('package-lock.json', { force: true })"
          npm install --legacy-peer-deps --include=optional --no-audit --no-fund
          npm install --no-save --include=optional electron@34.3.0 electron-builder@26.18.0 --legacy-peer-deps --no-audit --no-fund
          node scripts/ensure-native-bindings.mjs

      - name: Build frontend, Express backend & desktop icon assets
        run: |
          npm run build
          npm run build:server
          node scripts/ensure-desktop-icons.mjs

      - name: Package installer (${{ matrix.platform_flag }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "6"
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
        run: |
          node scripts/package-desktop.mjs ${{ matrix.platform_flag }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: texcellent-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: [test-and-lint, build-desktop]
    if: inputs.create_release
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          name: TeXcellent ${{ inputs.release_tag }}
          files: |
            artifacts/*
          generate_release_notes: true
