name: Build TeXcellent Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with installer assets'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag name for manual release (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --include=optional --no-audit --no-fund --prefer-offline

      - name: Run TypeScript check
        run: npm run lint

      - name: Run unit tests
        run: npm test

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_path: 'release/*.AppImage'
            platform_flag: '--linux AppImage'
          - os: windows-latest
            artifact_path: 'release/*.exe'
            platform_flag: '--win nsis'
          - os: macos-latest
            artifact_path: 'release/*.dmg'
            platform_flag: '--mac dmg'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ runner.temp }}/eb-cache
          key: ${{ runner.os }}-desktop-cache-v2-${{ hashFiles('package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cache-v2-

      - name: Install Linux AppImage build dependencies (FUSE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2t64 || sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: Enable Windows Developer Mode for winCodeSign symlinks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          Set-ItemProperty -Path $regPath -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Type DWord -Force

      - name: Install project & Electron dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --include=optional --no-audit --no-fund --prefer-offline
          npm install --no-save electron@34.3.0 electron-builder@26.18.0 --legacy-peer-deps --no-audit --no-fund --prefer-offline

      - name: Build frontend & Express backend assets
        run: |
          npm run build
          npm run build:server

      - name: Package installer (${{ matrix.platform_flag }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "6"
        run: |
          rm -rf release
          npx electron-builder --config electron-builder.yml ${{ matrix.platform_flag }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: texcellent-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: [test-and-lint, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            artifacts/*
          generate_release_notes: true
